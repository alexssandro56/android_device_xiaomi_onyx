# thermal-engine-v2 configuration for onyx
#
# Only real thermal zones are used: virtual sensors with trip sensors crash
# this thermal-engine-v2 build in init_sensor_list(). quiet_therm is the
# board thermistor the thermal HAL also reports as the skin temperature.
#
# The built-in Qualcomm sections (junction fail-safe, cold modem voltage,
# camera exit) stay enabled.

# CPU: two mild steps at 43.5C and 44.2C on the skin, then Xiaomi's tgame
# frequency steps, down to the same 633MHz floor at 48C.
# thermal-engine-v2 drives the kernel cpufreq cooling devices, whose state is
# the index in the descending frequency table of each policy:
#   cpufreq-cpu2 (big)      3=2707200 6=2438400 8=2208000 9=2073600 10=1920000 12=1728000 16=1286400 21=633600
#   cpufreq-cpu5 (titanium) 1=2707200 4=2438400 6=2208000 7=2073600 8=1920000 10=1728000 14=1286400 19=633600
#   cpufreq-cpu7 (prime)    3=2956800 6=2630400 8=2400000 11=2054400 12=1920000 13=1785600 17=1228800 21=633600
#   cpufreq-cpu0 (little)   4=1516800 8=1075200
# One section per cluster keeps every line well under the 256 characters
# thermal-engine prints a setting with.
[SKIN-CPU2]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      43500 44200 44900 45500 46100 46700 47300 48000
thresholds_clr  42500 43500 44200 44900 45500 46100 46700 47300
actions         cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2
action_info     3 6 8 9 10 12 16 21

[SKIN-CPU5]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      43500 44200 44900 45500 46100 46700 47300 48000
thresholds_clr  42500 43500 44200 44900 45500 46100 46700 47300
actions         cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5
action_info     1 4 6 7 8 10 14 19

[SKIN-CPU7]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      43500 44200 44900 45500 46100 46700 47300 48000
thresholds_clr  42500 43500 44200 44900 45500 46100 46700 47300
actions         cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7
action_info     3 6 8 11 12 13 17 21

[SKIN-CPU0]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      45000 48000
thresholds_clr  44000 47000
actions         cpufreq-cpu0 cpufreq-cpu0
action_info     4 8

# GPU: full speed until 44.5C on the skin, then step down.
[SKIN-GPU]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      44500 46000 47500 49000 51000
thresholds_clr  43500 45000 46500 48000 50000
actions         gpu gpu gpu gpu gpu
action_info     937000000 763000000 644000000 510000000 362000000

# Charging current. "battery" is the MCA wired thermal cooling device:
# level 1 = 13.5A, 2 = 11A, 4 = 8A, 6 = 6A, 7 = 5A, 9 = 3.5A, 12 = 2A,
# 14 = 1A, 15 = 0.5A. The steps follow mi_thermald's AR/VR charging table,
# which the ROM used while charging.
[SKIN-CHG]
algo_type       monitor
sensor          quiet_therm
sampling        2000
thresholds      35500 37000 38500 40000 41300 43000 44500 45500
thresholds_clr  34500 36000 37500 39000 40300 42000 43500 44500
actions         battery battery battery battery battery battery battery battery
action_info     1 2 4 6 7 9 14 15

# Battery cell temperature, as a second limit on top of the skin one. The
# charger's own JEITA limits still apply above 48C.
[BATT-CHG]
algo_type       monitor
sensor          batt_therm
sampling        2000
thresholds      40000 42000 44000 45000 46000
thresholds_clr  39000 41000 43000 44000 45000
actions         battery battery battery battery battery
action_info     6 9 12 14 15
