# thermal-engine-v2 configuration for onyx
#
# Only real thermal zones are used: virtual sensors with trip sensors crash
# this thermal-engine-v2 build in init_sensor_list(). quiet_therm is the
# board thermistor the thermal HAL also reports as the skin temperature.
#
# The built-in Qualcomm sections (junction fail-safe, cold modem voltage,
# camera exit) stay enabled.

# CPU: two mild steps at 43.5C and 44.2C on the skin, then Xiaomi's tgame
# frequency steps, with a 1517/1517/1478MHz step at 47C between the
# 1728/1728/1786MHz and 1286/1286/1229MHz ones, down to the same 633MHz
# floor at 48C.
# thermal-engine-v2 drives the kernel cpufreq cooling devices, whose state is
# the index in the descending frequency table of each policy:
#   cpufreq-cpu2 (big)      3=2707200 6=2438400 8=2208000 9=2073600 10=1920000 12=1728000 14=1516800 16=1286400 21=633600
#   cpufreq-cpu5 (titanium) 1=2707200 4=2438400 6=2208000 7=2073600 8=1920000 10=1728000 12=1516800 14=1286400 19=633600
#   cpufreq-cpu7 (prime)    3=2956800 6=2630400 8=2400000 11=2054400 12=1920000 13=1785600 15=1478400 17=1228800 21=633600
#   cpufreq-cpu0 (little)   4=1516800 8=1075200
# One section per cluster keeps every line well under the 256 characters
# thermal-engine prints a setting with.
[SKIN-CPU2]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      39500 40200 40900 41500 42100 42700 43000 43300 44000
thresholds_clr      38500 39500 40200 40900 41500 42100 42700 43000 43300
actions         cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2 cpufreq-cpu2
action_info     3 6 8 9 10 12 14 16 21

[SKIN-CPU5]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      39500 40200 40900 41500 42100 42700 43000 43300 44000
thresholds_clr      38500 39500 40200 40900 41500 42100 42700 43000 43300
actions         cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5 cpufreq-cpu5
action_info     1 4 6 7 8 10 12 14 19

[SKIN-CPU7]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      39500 40200 40900 41500 42100 42700 43000 43300 44000
thresholds_clr      38500 39500 40200 40900 41500 42100 42700 43000 43300
actions         cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7 cpufreq-cpu7
action_info     3 6 8 11 12 13 15 17 21

[SKIN-CPU0]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      41000 44000
thresholds_clr      40000 43000
actions         cpufreq-cpu0 cpufreq-cpu0
action_info     4 8

# GPU: full speed until 44.5C on the skin, then step down. 688MHz sits
# between 763 and 644MHz, and 510MHz waits until 50C: in the Wild Life
# Extreme stress test the skin settles between 47.5 and 49C, where these
# steps keep the GPU at 688 or 644MHz instead of dropping to 510MHz.
[SKIN-GPU]
algo_type       monitor
sensor          quiet_therm
sampling        1000
thresholds      40500 42000 43500 44500 46000 48000
thresholds_clr      39500 41000 42500 43500 45000 47000
actions         gpu gpu gpu gpu gpu gpu
action_info     937000000 763000000 688000000 644000000 510000000 362000000

# Charging current. "battery" is the MCA wired thermal cooling device:
# level 1 = 13.5A, 2 = 11A, 4 = 8A, 6 = 6A, 7 = 5A, 9 = 3.5A, 12 = 2A,
# 14 = 1A, 15 = 0.5A. The steps follow mi_thermald's AR/VR charging table,
# which the ROM used while charging.
[SKIN-CHG]
algo_type       monitor
sensor          quiet_therm
sampling        2000
thresholds      31500 33000 34500 36000 37300 39000 40500 41500
thresholds_clr      30500 32000 33500 35000 36300 38000 39500 40500
actions         battery battery battery battery battery battery battery battery
action_info     1 2 4 6 7 9 14 15

# Battery cell temperature, as a second limit on top of the skin one. The
# charger's own JEITA limits still apply above 48C.
[BATT-CHG]
algo_type       monitor
sensor          batt_therm
sampling        2000
thresholds      36000 38000 40000 41000 42000
thresholds_clr      35000 37000 39000 40000 41000
actions         battery battery battery battery battery
action_info     6 9 12 14 15
